server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: zbtech-community
  # ============ MySQL (foxbook -> zbtech, table prefix lb_) ============
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://10.10.9.171:3306/zbtech?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ttk123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
  # ============ Redis (token / cache / queue) ============
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 5000ms
      # password:        # 若 Redis 有密码请在此填写

# ============ MyBatis-Plus ============
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.zbtech.community.entity
  global-config:
    db-config:
      table-prefix: lb_
      id-type: auto
  configuration:
    # 实体属性名均为下划线风格（role_id/created_at...），与数据库列一一对应。
    # 若开启驼峰映射(map-underscore-to-camel-case=true)，MyBatis autoMapping 会把列 role_id
    # 转成 roleId 去匹配属性，导致下划线字段全部映射为 null（如 getRole_id() 返回 null → "角色不存在"）。
    # 故必须关闭；本项目无驼峰属性名实体，无任何副作用。
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ============ springdoc / OpenAPI ============
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  info:
    title: zbtech-community API
    description: 论坛社区接口文档（原 foxbook 翻译为 Spring Boot 3.0，表前缀 lb_）
    version: 1.0.0

logging:
  level:
    com.zbtech.community: debug
